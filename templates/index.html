<!DOCTYPE html>
<html lang="pl" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streszczanie tekstu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #text {
            min-height: 18rem;
            resize: vertical;
        }

        #detected-lang img {
            vertical-align: -0.125em;
            margin-left: .25rem;
        }
    </style>

</head>

<body>
    <main class="container py-4 py-md-5">
        <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1">Streszczanie tekstu</h1>
                <p class="text-body-secondary mb-0">Wklej tekst i wybierz parametry streszczenia.</p>
            </div>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="themeToggle">🌙 Ciemny motyw</button>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="card shadow-sm">
            <div class="card-body p-3 p-md-4">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="text" class="form-label">Wpisz tekst do streszczenia</label>
                        <textarea name="text" id="text" class="form-control" required
                            placeholder="Wklej tutaj tekst...">{{ original_text or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="text_file" class="form-label">Lub wgraj plik .txt</label>
                        <input class="form-control" type="file" id="text_file" name="text_file" accept=".txt">
                        <div class="form-text">Jeśli wgrasz plik, jego treść zostanie użyta zamiast tekstu z pola powyżej.</div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label for="summary_length" class="form-label mb-0">Długość streszczenia</label>
                            <select name="summary_length" id="summary_length" class="form-select mt-1">
                                <option value="short" {% if summary_length=='short' %}selected{% endif %}>krótkie</option>
                                <option value="medium" {% if summary_length=='medium' %}selected{% endif %}>średnie</option>
                                <option value="long" {% if summary_length=='long' %}selected{% endif %}>długie</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <div class="d-flex align-items-center justify-content-between">
                                <label for="lang" class="form-label mb-0">Język definicji</label>
                                <small id="detected-lang" class="text-body-secondary">Odnaleziony język: —</small>
                            </div>
                            <select name="lang" id="lang" class="form-select mt-1">
                                <option value="en" {% if lang=='en' %}selected{% endif %}>angielski</option>
                                <option value="pl" {% if lang=='pl' %}selected{% endif %}>polski</option>
                                <option value="de" {% if lang=='de' %}selected{% endif %}>niemiecki</option>
                                <option value="es" {% if lang=='es' %}selected{% endif %}>hiszpański</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="to_lang" class="form-label">Przetłumacz na:</label>
                                <select name="to_lang" id="to_lang" class="form-select">
                                    <option value="pl">polski</option>
                                    <option value="en" selected>angielski</option>
                                    <option value="de">niemiecki</option>
                                    <option value="es">hiszpański</option>
                                </select>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                          <button type="submit" name="action" value="summarize" class="btn btn-primary">Streszczaj</button>
                          <button type="submit" name="action" value="translate" class="btn btn-outline-primary">Tłumacz</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const themeToggleBtn = document.getElementById("themeToggle");
        const root = document.documentElement;

        function applyTheme(theme) {
            root.dataset.bsTheme = theme;
            localStorage.setItem("theme", theme);
            themeToggleBtn.textContent = theme === "dark" ? "☀️ Jasny motyw" : "🌙 Ciemny motyw";
        }

        applyTheme(localStorage.getItem("theme") === "dark" ? "dark" : "light");

        themeToggleBtn.addEventListener("click", () => {
            applyTheme(root.dataset.bsTheme === "dark" ? "light" : "dark");
        });

        async function detectLanguage() {
            const textarea = document.querySelector("textarea[name='text']");
            const select = document.querySelector("select[name='lang']");
            const output = document.getElementById("detected-lang");

            if (!textarea.value.trim()) return;

            const res = await fetch("/detect-language", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: textarea.value })
            });

            const data = await res.json();

            const map = {
                "pl": "Polski ",
                "en": "English ",
                "de": "Deutsch ",
                "es": "Español "
            };

            const mapFlags = {
                "pl": '<img src="https://flagcdn.com/64x48/pl.png" srcset="https://flagcdn.com/128x96/pl.png 2x, https://flagcdn.com/192x144/pl.png 3x" width="16" height="12" alt="PL">',
                "en": '<img src="https://flagcdn.com/64x48/gb.png" srcset="https://flagcdn.com/128x96/gb.png 2x, https://flagcdn.com/192x144/gb.png 3x" width="16" height="12" alt="EN">',
                "de": '<img src="https://flagcdn.com/64x48/de.png" srcset="https://flagcdn.com/128x96/de.png 2x, https://flagcdn.com/192x144/de.png 3x" width="16" height="12" alt="DE">',
                "es": '<img src="https://flagcdn.com/64x48/es.png" srcset="https://flagcdn.com/128x96/es.png 2x, https://flagcdn.com/192x144/es.png 3x" width="16" height="12" alt="ES">'
            };

            if (data.lang) {
                output.innerHTML = "Odnaleziony język: " + (map[data.lang] || data.lang) + (mapFlags[data.lang] || "");
                if (map[data.lang]) select.value = data.lang;
            }
        }

        document.querySelector("textarea[name='text']")
            .addEventListener("blur", detectLanguage);
    </script>
    <script>
        document.getElementById("text_file").addEventListener("change", function () {
            const textarea = document.querySelector("textarea[name='text']");
            if (this.files.length > 0) {
                textarea.value = "";
                textarea.disabled = true;
            } else {
                textarea.disabled = false;
            }
        });
    </script>
    <script>
        const textarea = document.querySelector('textarea[name="text"]');
        const fileInput = document.getElementById('text_file');
        const detectedLangLabel = document.getElementById("detected-lang");
        const langSelect = document.getElementById("lang");

        let detectTimer = null;

        function updateDetectedLang(lang) {
            detectedLangLabel.textContent = `Odnaleziony język: ${lang}`;

            // jeżeli select zawiera taki język → ustaw go
            const option = langSelect.querySelector(`option[value="${lang}"]`);
            if (option) {
            langSelect.value = lang;
            }
        }

        async function detectLanguage(text) {
            const sample = (text || "").trim().slice(0, 500);
            if (!sample) {
            detectedLangLabel.textContent = "Odnaleziony język: —";
            return;
            }

            detectedLangLabel.textContent = "Odnaleziony język: ...";

            try {
            const res = await fetch("/detect-lang", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: sample })
            });

            if (!res.ok) {
                detectedLangLabel.textContent = "Odnaleziony język: błąd";
                return;
            }

            const data = await res.json();
            if (data.ok) {
                updateDetectedLang(data.lang);
            } else {
                detectedLangLabel.textContent = "Odnaleziony język: błąd";
            }
            } catch (e) {
            detectedLangLabel.textContent = "Odnaleziony język: błąd";
            }
        }

        function debounceDetect(text) {
            clearTimeout(detectTimer);
            detectTimer = setTimeout(() => detectLanguage(text), 400);
        }

        // textarea → wykrywanie
        if (textarea) {
            textarea.addEventListener("input", () => {
            debounceDetect(textarea.value);
            });
        }

        // plik .txt → wykrywanie
        if (fileInput) {
            fileInput.addEventListener("change", async () => {
            const file = fileInput.files?.[0];
            if (!file) return;

            if (!file.name.toLowerCase().endsWith(".txt")) {
                detectedLangLabel.textContent = "Odnaleziony język: tylko .txt";
                return;
            }

            try {
                const blob = file.slice(0, 20000);
                const text = await blob.text();
                detectLanguage(text);
            } catch {
                detectedLangLabel.textContent = "Odnaleziony język: błąd";
            }
            });
        }
    </script>
    
</body>

</html>
