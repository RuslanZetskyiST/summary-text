<!DOCTYPE html>
<html lang="pl" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wynik tłumaczenia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #original_text,
        #translated_text {
            min-height: 14rem;
            resize: vertical;
        }
    </style>
</head>

<body>
    <main class="container py-4 py-md-5">
        <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1">Wynik tłumaczenia</h1>
                <p class="text-body-secondary mb-0">
                    {% if from_lang and to_lang %}
                    Z: <strong>{{ from_lang }}</strong> → Na: <strong>{{ to_lang }}</strong>
                    {% else %}
                    Gotowe tłumaczenie.
                    {% endif %}
                </p>
            </div>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="themeToggle">🌙 Ciemny motyw</button>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body p-3 p-md-4">
                <label for="original_text" class="form-label">Oryginalny tekst</label>
                <textarea id="original_text" class="form-control" rows="10" readonly>{{ original_text or '' }}</textarea>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-3 p-md-4">
                <label for="translated_text" class="form-label">Tłumaczenie</label>
                <textarea id="translated_text" class="form-control" rows="10" readonly>{{ translated_text or '' }}</textarea>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <a href="/" class="btn btn-primary">Powrót</a>
                    <button type="button" class="btn btn-outline-secondary" onclick="navigator.clipboard.writeText(document.getElementById('translated_text').value)">
                        Kopiuj tłumaczenie
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const themeToggleBtn = document.getElementById("themeToggle");
        const root = document.documentElement;

        function applyTheme(theme) {
            root.dataset.bsTheme = theme;
            localStorage.setItem("theme", theme);
            themeToggleBtn.textContent = theme === "dark" ? "☀️ Jasny motyw" : "🌙 Ciemny motyw";
        }

        applyTheme(localStorage.getItem("theme") === "dark" ? "dark" : "light");

        themeToggleBtn.addEventListener("click", () => {
            applyTheme(root.dataset.bsTheme === "dark" ? "light" : "dark");
        });
    </script>
</body>

</html>
